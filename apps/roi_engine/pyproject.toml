[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "roi-engine"
version = "0.1.0"
description = "Artifact-based ROI calculation for Auto-Claude"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [
    { name = "Auto-Claude Team" }
]
keywords = [
    "roi",
    "analytics",
    "artifacts",
    "auto-claude",
    "langfuse",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "fastapi>=0.109.0",
    "uvicorn>=0.27.0",
    "pydantic>=2.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "httpx>=0.25.0",
]
langfuse = [
    "langfuse>=2.0.0",
]

[project.urls]
Documentation = "https://github.com/AndyMik90/Auto-Claude#readme"
Repository = "https://github.com/AndyMik90/Auto-Claude"

[project.scripts]
roi-engine = "roi_engine.api.app:main"

[tool.hatch.build.targets.wheel]
packages = ["core", "api"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # do not perform function calls in argument defaults
]

[tool.ruff.lint.isort]
known-first-party = ["roi_engine"]
