name: Sync with Upstream Repository

on:
  # Executa diariamente à meia-noite UTC
  schedule:
    - cron: '0 0 * * *'
  
  # Permite execução manual do workflow
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch full history
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      
      - name: Add upstream remote
        run: |
          git remote add upstream https://github.com/AndyMik90/Auto-Claude.git || true
          git remote -v
      
      - name: Fetch upstream changes
        run: |
          git fetch upstream
      
      - name: Merge upstream/main into main
        run: |
          git checkout main
          git merge upstream/main --no-edit || echo "No changes to merge or conflicts detected"
      
      - name: Push changes
        run: |
          git push origin main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Create sync report
        if: always()
        run: |
          echo "### Sync Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Upstream:** AndyMik90/Auto-Claude" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** main" >> $GITHUB_STEP_SUMMARY
          echo "**Status:** ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "**Time:** $(date)" >> $GITHUB_STEP_SUMMARY
